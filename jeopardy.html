<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bible Bowl Jeopardy</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: #07116f;
        color: white;
        text-align: center;
    }

    header {
        background: #050b4d;
        padding: 18px;
        border-bottom: 4px solid #f7c928;
    }

    h1 {
        margin: 0;
        color: #f7c928;
        font-size: 34px;
    }

    #chapterTitle {
        margin-top: 8px;
        font-size: 20px;
    }

    .scores {
        display: flex;
        justify-content: center;
        gap: 18px;
        flex-wrap: wrap;
        padding: 18px 10px;
    }

    .team {
        background: #101b82;
        border: 2px solid #f7c928;
        border-radius: 10px;
        padding: 12px 18px;
        min-width: 180px;
    }

    .team-name {
        font-weight: bold;
        font-size: 18px;
        margin-bottom: 6px;
    }

    .score {
        font-size: 28px;
        color: #f7c928;
        margin-bottom: 8px;
    }

    .score-buttons button {
        margin: 3px;
        padding: 7px 10px;
        cursor: pointer;
        border: none;
        border-radius: 5px;
        font-weight: bold;
    }

    .board-wrap {
        width: 96%;
        max-width: 1200px;
        margin: 0 auto 25px;
        overflow-x: auto;
    }

    #board {
        display: grid;
        grid-template-columns: repeat(5, minmax(150px, 1fr));
        gap: 5px;
        min-width: 800px;
        background: #050505;
        padding: 5px;
    }

    .category {
        background: #101b82;
        color: white;
        min-height: 100px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 10px;
        font-size: 18px;
        font-weight: bold;
        text-transform: uppercase;
    }

    .question-cell {
        background: #0718a0;
        color: #f7c928;
        height: 100px;
        border: none;
        cursor: pointer;
        font-size: 28px;
        font-weight: bold;
    }

    .question-cell:hover {
        background: #142bc2;
    }

    .question-cell.completed {
        background: #171717;
        color: #d4d4d4;
        cursor: default;
        font-size: 32px;
    }

    .controls {
        margin: 20px 0 35px;
    }

    .controls button,
    .controls a {
        display: inline-block;
        margin: 6px;
        padding: 11px 18px;
        border: none;
        border-radius: 7px;
        font-size: 15px;
        font-weight: bold;
        cursor: pointer;
        text-decoration: none;
    }

    .reset-btn {
        background: #f7c928;
        color: #111;
    }

    .home-btn {
        background: white;
        color: #07116f;
    }

    .modal {
        display: none;
        position: fixed;
        z-index: 1000;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        overflow: auto;
        background: rgba(0,0,0,.88);
        padding: 25px 15px;
    }

    .modal-content {
        background: #0718a0;
        border: 4px solid #f7c928;
        border-radius: 14px;
        max-width: 860px;
        margin: 20px auto;
        padding: 28px;
    }

    .question-value {
        display: inline-block;
        background: #050b4d;
        color: #f7c928;
        padding: 7px 13px;
        border-radius: 999px;
        font-weight: bold;
        margin-bottom: 12px;
    }

    .scripture {
        color: #f7c928;
        font-size: 21px;
        font-weight: bold;
        margin-bottom: 16px;
    }

    .question-text {
        font-size: 25px;
        line-height: 1.4;
        margin-bottom: 22px;
    }

    .team-select-area {
        background: #050b4d;
        padding: 14px;
        border-radius: 10px;
        margin-bottom: 18px;
    }

    .team-select-area label {
        font-weight: bold;
        margin-right: 8px;
    }

    .team-select-area select {
        padding: 9px 12px;
        font-size: 16px;
        border-radius: 6px;
    }

    .answers {
        display: grid;
        grid-template-columns: 1fr;
        gap: 12px;
        text-align: left;
    }

    .answer-choice {
        width: 100%;
        background: white;
        color: #111;
        padding: 14px 16px;
        border: 3px solid transparent;
        border-radius: 8px;
        font-size: 19px;
        text-align: left;
        cursor: pointer;
        min-height: 54px;
    }

    .answer-choice:hover:not(:disabled) {
        background: #f4f6ff;
    }

    .answer-choice.selected {
        background: #dbe6ff;
        border-color: #f7c928;
    }

    .answer-choice.correct {
        background: #b8f1bd;
        border-color: #1d7a2e;
        color: #164d1e;
        font-weight: bold;
    }

    .answer-choice.wrong {
        background: #f5b6b6;
        border-color: #a51d1d;
        color: #6f1010;
        font-weight: bold;
    }

    .answer-choice:disabled {
        cursor: default;
        opacity: 1;
    }

    .result-message {
        min-height: 30px;
        margin-top: 18px;
        font-size: 21px;
        font-weight: bold;
    }

    .result-message.correct-text {
        color: #b8f1bd;
    }

    .result-message.wrong-text {
        color: #ffd0d0;
    }

    .modal-buttons {
        margin-top: 22px;
    }

    .modal-buttons button {
        padding: 11px 16px;
        margin: 5px;
        border: none;
        border-radius: 7px;
        cursor: pointer;
        font-weight: bold;
        font-size: 16px;
    }

    .enter-btn {
        background: #f7c928;
        color: #111;
    }

    .enter-btn:disabled {
        opacity: .45;
        cursor: not-allowed;
    }

    .close-btn {
        background: white;
        color: #07116f;
    }

    .close-btn:disabled {
        opacity: .45;
        cursor: not-allowed;
    }

    .surprise {
        background: #f7c928;
        color: #07116f;
        padding: 20px;
        border-radius: 12px;
        margin-bottom: 20px;
    }

    .surprise h2 {
        margin: 0 0 10px;
        font-size: 32px;
    }

    .surprise p {
        margin: 6px 0 12px;
        font-weight: bold;
    }

    .wager-row {
        display: flex;
        justify-content: center;
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
        margin-top: 12px;
    }

    .wager-row select {
        padding: 9px 12px;
        font-size: 16px;
        border-radius: 6px;
    }

    .wager-status {
        margin-top: 12px;
        font-weight: bold;
    }

    .error {
        max-width: 750px;
        margin: 40px auto;
        padding: 25px;
        background: white;
        color: #a00000;
        border-radius: 10px;
    }

    @media(max-width: 600px) {
        h1 {
            font-size: 27px;
        }

        .question-text {
            font-size: 21px;
        }

        .modal-content {
            padding: 20px 15px;
        }

        .answer-choice {
            font-size: 17px;
        }
    }
</style>
</head>

<body>

<header>
    <h1>BIBLE BOWL JEOPARDY</h1>
    <div id="chapterTitle">Loading...</div>
</header>

<div class="scores">

    <div class="team">
        <div class="team-name">Team 1</div>
        <div class="score" id="score1">0</div>
        <div class="score-buttons">
            <button onclick="adjustScore(1,100)">+100</button>
            <button onclick="adjustScore(1,-100)">-100</button>
        </div>
    </div>

    <div class="team">
        <div class="team-name">Team 2</div>
        <div class="score" id="score2">0</div>
        <div class="score-buttons">
            <button onclick="adjustScore(2,100)">+100</button>
            <button onclick="adjustScore(2,-100)">-100</button>
        </div>
    </div>

    <div class="team">
        <div class="team-name">Team 3</div>
        <div class="score" id="score3">0</div>
        <div class="score-buttons">
            <button onclick="adjustScore(3,100)">+100</button>
            <button onclick="adjustScore(3,-100)">-100</button>
        </div>
    </div>

</div>

<div class="board-wrap">
    <div id="board"></div>
</div>

<div class="controls">
    <button class="reset-btn" onclick="resetGame()">Reset Game</button>
    <a class="home-btn" href="index.html">Return to Study Center</a>
</div>

<div id="questionModal" class="modal">

    <div class="modal-content">

        <div id="surpriseArea"></div>

        <div class="question-value" id="modalValue"></div>

        <div class="scripture" id="modalScripture"></div>

        <div class="question-text" id="modalQuestion"></div>

        <div class="team-select-area">
            <label for="answeringTeam">Answering Team:</label>

            <select id="answeringTeam">
                <option value="1">Team 1</option>
                <option value="2">Team 2</option>
                <option value="3">Team 3</option>
            </select>
        </div>

        <div class="answers" id="modalAnswers"></div>

        <div class="result-message" id="resultMessage"></div>

        <div class="modal-buttons">

            <button
                class="enter-btn"
                id="enterAnswerBtn"
                onclick="enterAnswer()"
                disabled>
                Enter Answer
            </button>

            <button
                class="close-btn"
                id="returnBtn"
                onclick="finishQuestion()"
                disabled>
                Return to Board
            </button>

        </div>

    </div>

</div>

<script>

const GAME_SETS = {

    genesis3: {
        title: "Genesis Chapter 3",
        file: "Genesis 3 Jeopardy Questions.csv"
    },

    genesis4: {
        title: "Genesis Chapter 4",
        file: "Genesis 4 Jeopardy Questions.csv"
    }

};


let questions = [];
let currentQuestion = null;
let currentQuestionIndex = null;
let currentCell = null;

let scores = [0,0,0];

let surpriseQuestions = new Set();

let selectedAnswer = null;
let answerLocked = false;

let currentWager = 0;
let surpriseLocked = false;


function getGameSet() {

    const params =
        new URLSearchParams(
            window.location.search
        );

    return params.get("set") || "genesis3";
}


async function startGame() {

    const setName = getGameSet();

    const game = GAME_SETS[setName];

    if (!game) {

        showError(
            "The requested Bible Bowl game could not be found."
        );

        return;
    }


    document.getElementById(
        "chapterTitle"
    ).textContent = game.title;


    try {

        const response =
            await fetch(game.file);

        if (!response.ok) {
            throw new Error(
                "Question file could not be loaded."
            );
        }

        const text =
            await response.text();

        questions =
            parseCSV(text);

        if (questions.length !== 25) {

            throw new Error(
                "This game requires exactly 25 questions."
            );
        }

        chooseSurpriseQuestions();

        buildBoard();

    }

    catch(error) {

        showError(
            "The game questions could not be loaded. " +
            "Please verify that the CSV file is uploaded " +
            "in the same repository as jeopardy.html."
        );

        console.error(error);
    }
}


function parseCSV(text) {

    const rows = [];

    let row = [];
    let field = "";
    let insideQuotes = false;


    for (
        let i = 0;
        i < text.length;
        i++
    ) {

        const char = text[i];

        const next =
            text[i + 1];


        if (char === '"') {

            if (
                insideQuotes &&
                next === '"'
            ) {

                field += '"';
                i++;

            }

            else {

                insideQuotes =
                    !insideQuotes;

            }

        }

        else if (
            char === "," &&
            !insideQuotes
        ) {

            row.push(field);

            field = "";

        }

        else if (
            (char === "\n" ||
             char === "\r") &&
            !insideQuotes
        ) {

            if (
                char === "\r" &&
                next === "\n"
            ) {
                i++;
            }

            row.push(field);

            if (
                row.some(
                    value =>
                    value.trim() !== ""
                )
            ) {

                rows.push(row);

            }

            row = [];
            field = "";

        }

        else {

            field += char;

        }
    }


    if (
        field.length > 0 ||
        row.length > 0
    ) {

        row.push(field);

        rows.push(row);
    }


    const headers =
        rows[0].map(
            h =>
            h.replace(
                /^\uFEFF/,
                ""
            ).trim()
        );


    return rows
        .slice(1)
        .map(row => {

            const obj = {};

            headers.forEach(
                (header,index) => {

                    obj[header] =
                        (
                            row[index] || ""
                        ).trim();

                }
            );

            obj.Points =
                Number(obj.Points);

            return obj;

        })
        .filter(
            q => q.Category
        );
}


function chooseSurpriseQuestions() {

    surpriseQuestions.clear();

    while (
        surpriseQuestions.size < 2
    ) {

        const index =
            Math.floor(
                Math.random() *
                questions.length
            );

        surpriseQuestions.add(index);

    }
}


function buildBoard() {

    const board =
        document.getElementById("board");

    board.innerHTML = "";


    const categories =
        [...new Set(
            questions.map(
                q => q.Category
            )
        )];


    if (categories.length !== 5) {

        showError(
            "This game requires exactly 5 categories."
        );

        return;
    }


    categories.forEach(category => {

        const header =
            document.createElement("div");

        header.className =
            "category";

        header.textContent =
            category;

        board.appendChild(header);

    });


    const pointValues =
        [100,200,300,400,500];


    pointValues.forEach(points => {

        categories.forEach(category => {

            const qIndex =
                questions.findIndex(
                    q =>
                    q.Category === category &&
                    q.Points === points
                );


            const cell =
                document.createElement("button");

            cell.className =
                "question-cell";

            cell.textContent =
                "$" + points;


            if (qIndex >= 0) {

                cell.onclick =
                    () =>
                    openQuestion(
                        qIndex,
                        cell
                    );

            }

            else {

                cell.textContent = "—";
                cell.disabled = true;

            }


            board.appendChild(cell);

        });

    });

}


function openQuestion(index, cell) {

    if (
        cell.classList.contains(
            "completed"
        )
    ) {
        return;
    }


    currentQuestion =
        questions[index];

    currentQuestionIndex =
        index;

    currentCell = cell;

    selectedAnswer = null;
    answerLocked = false;

    currentWager = 0;
    surpriseLocked = false;


    document.getElementById(
        "modalValue"
    ).textContent =
        "$" + currentQuestion.Points;


    document.getElementById(
        "modalScripture"
    ).textContent =
        currentQuestion.Scripture;


    document.getElementById(
        "modalQuestion"
    ).textContent =
        currentQuestion.Question;


    document.getElementById(
        "resultMessage"
    ).textContent = "";

    document.getElementById(
        "resultMessage"
    ).className =
        "result-message";


    document.getElementById(
        "enterAnswerBtn"
    ).disabled = true;


    document.getElementById(
        "returnBtn"
    ).disabled = true;


    document.getElementById(
        "answeringTeam"
    ).disabled = false;


    const answers =
        document.getElementById(
            "modalAnswers"
        );

    answers.innerHTML = "";


    ["A","B","C","D"]
        .forEach(letter => {

            const button =
                document.createElement(
                    "button"
                );

            button.type = "button";

            button.className =
                "answer-choice";

            button.dataset.letter =
                letter;

            button.innerHTML =
                "<strong>" +
                letter +
                ".</strong> " +
                currentQuestion[
                    letter
                ];

            button.onclick =
                () =>
                selectAnswer(
                    letter,
                    button
                );

            answers.appendChild(button);

        });


    buildSurpriseArea(index);


    document.getElementById(
        "questionModal"
    ).style.display =
        "block";
}


function selectAnswer(letter, button) {

    if (answerLocked) {
        return;
    }


    if (
        surpriseQuestions.has(
            currentQuestionIndex
        ) &&
        !surpriseLocked
    ) {

        alert(
            "Lock in the Surprise Jeopardy wager first."
        );

        return;
    }


    selectedAnswer = letter;


    document
        .querySelectorAll(
            ".answer-choice"
        )
        .forEach(choice => {

            choice.classList.remove(
                "selected"
            );

        });


    button.classList.add(
        "selected"
    );


    document.getElementById(
        "enterAnswerBtn"
    ).disabled = false;
}


function buildSurpriseArea(index) {

    const surpriseArea =
        document.getElementById(
            "surpriseArea"
        );

    surpriseArea.innerHTML = "";


    if (
        !surpriseQuestions.has(index)
    ) {
        return;
    }


    surpriseArea.innerHTML = `

        <div class="surprise">

            <h2>
                SURPRISE JEOPARDY!
            </h2>

            <p>
                Choose the answering team and lock in the wager before selecting an answer.
            </p>

            <div class="wager-row">

                <label for="wagerAmount">
                    Wager:
                </label>

                <select id="wagerAmount"></select>

                <button
                    type="button"
                    onclick="lockWager()">
                    Lock Wager
                </button>

            </div>

            <div
                class="wager-status"
                id="wagerStatus">
            </div>

        </div>

    `;


    updateWagerOptions();


    document.getElementById(
        "answeringTeam"
    ).onchange =
        updateWagerOptions;
}


function updateWagerOptions() {

    if (
        currentQuestionIndex === null ||
        !surpriseQuestions.has(
            currentQuestionIndex
        )
    ) {
        return;
    }


    if (surpriseLocked) {
        return;
    }


    const team =
        Number(
            document.getElementById(
                "answeringTeam"
            ).value
        );


    const teamScore =
        scores[team - 1];


    const maxWager =
        Math.max(
            teamScore,
            currentQuestion.Points
        );


    const wagerSelect =
        document.getElementById(
            "wagerAmount"
        );

    if (!wagerSelect) {
        return;
    }


    wagerSelect.innerHTML = "";


    const safeMaximum =
        Math.max(
            100,
            Math.floor(
                maxWager / 100
            ) * 100
        );


    for (
        let wager = 100;
        wager <= safeMaximum;
        wager += 100
    ) {

        const option =
            document.createElement(
                "option"
            );

        option.value =
            wager;

        option.textContent =
            "$" + wager;

        wagerSelect.appendChild(
            option
        );

    }


    const preferred =
        Math.min(
            currentQuestion.Points,
            safeMaximum
        );


    wagerSelect.value =
        preferred;
}


function lockWager() {

    if (surpriseLocked) {
        return;
    }


    const wagerSelect =
        document.getElementById(
            "wagerAmount"
        );


    if (!wagerSelect) {
        return;
    }


    const wager =
        Number(
            wagerSelect.value
        );


    if (
        !Number.isFinite(wager) ||
        wager < 100 ||
        wager % 100 !== 0
    ) {

        alert(
            "Wagers must be in $100 increments."
        );

        return;
    }


    const team =
        Number(
            document.getElementById(
                "answeringTeam"
            ).value
        );


    const teamScore =
        scores[team - 1];


    const maxWager =
        Math.max(
            teamScore,
            currentQuestion.Points
        );


    if (wager > maxWager) {

        alert(
            "That wager is higher than the allowed maximum."
        );

        updateWagerOptions();

        return;
    }


    currentWager = wager;
    surpriseLocked = true;


    document.getElementById(
        "answeringTeam"
    ).disabled = true;


    wagerSelect.disabled = true;


    const lockButton =
        wagerSelect.parentElement
            .querySelector("button");

    if (lockButton) {
        lockButton.disabled = true;
    }


    document.getElementById(
        "wagerStatus"
    ).textContent =
        "Wager locked: Team " +
        team +
        " for $" +
        currentWager;
}


function enterAnswer() {

    if (
        answerLocked ||
        !selectedAnswer ||
        !currentQuestion
    ) {
        return;
    }


    if (
        surpriseQuestions.has(
            currentQuestionIndex
        ) &&
        !surpriseLocked
    ) {

        alert(
            "Lock in the Surprise Jeopardy wager first."
        );

        return;
    }


    answerLocked = true;


    const correctLetter =
        currentQuestion.Correct
            .trim()
            .toUpperCase();


    const isCorrect =
        selectedAnswer ===
        correctLetter;


    document
        .querySelectorAll(
            ".answer-choice"
        )
        .forEach(choice => {

            choice.disabled = true;


            if (
                choice.dataset.letter ===
                correctLetter
            ) {

                choice.classList.add(
                    "correct"
                );

            }


            if (
                choice.dataset.letter ===
                selectedAnswer &&
                !isCorrect
            ) {

                choice.classList.add(
                    "wrong"
                );

            }

        });


    const team =
        Number(
            document.getElementById(
                "answeringTeam"
            ).value
        );


    let scoreChange =
        currentQuestion.Points;


    if (
        surpriseQuestions.has(
            currentQuestionIndex
        )
    ) {

        scoreChange =
            currentWager;

    }


    if (!isCorrect) {

        scoreChange =
            -scoreChange;

    }


    adjustScore(
        team,
        scoreChange
    );


    const result =
        document.getElementById(
            "resultMessage"
        );


    if (isCorrect) {

        result.textContent =
            "Correct! Team " +
            team +
            " earns $" +
            Math.abs(scoreChange) +
            ".";

        result.className =
            "result-message correct-text";

    }

    else {

        result.textContent =
            "Incorrect. Team " +
            team +
            " loses $" +
            Math.abs(scoreChange) +
            ". The correct answer is shown in green.";

        result.className =
            "result-message wrong-text";

    }


    document.getElementById(
        "enterAnswerBtn"
    ).disabled = true;


    document.getElementById(
        "answeringTeam"
    ).disabled = true;


    document.getElementById(
        "returnBtn"
    ).disabled = false;
}


function finishQuestion() {

    if (!answerLocked) {
        return;
    }


    if (currentCell) {

        currentCell.classList.add(
            "completed"
        );

        currentCell.textContent =
            "✓";

        currentCell.onclick = null;
    }


    document.getElementById(
        "questionModal"
    ).style.display =
        "none";


    currentQuestion = null;
    currentQuestionIndex = null;
    currentCell = null;

    selectedAnswer = null;
    answerLocked = false;

    currentWager = 0;
    surpriseLocked = false;


    document.getElementById(
        "answeringTeam"
    ).onchange = null;
}


function adjustScore(team, amount) {

    if (
        amount % 100 !== 0
    ) {
        return;
    }


    scores[team - 1] += amount;


    document.getElementById(
        "score" + team
    ).textContent =
        scores[team - 1];
}


function resetGame() {

    const confirmed =
        confirm(
            "Reset the board and all team scores?"
        );

    if (!confirmed) {
        return;
    }


    scores = [0,0,0];


    for (
        let team = 1;
        team <= 3;
        team++
    ) {

        document.getElementById(
            "score" + team
        ).textContent = "0";

    }


    chooseSurpriseQuestions();

    buildBoard();
}


function showError(message) {

    document.querySelector(
        ".board-wrap"
    ).innerHTML = `

        <div class="error">

            <h2>
                Game Could Not Load
            </h2>

            <p>
                ${message}
            </p>

        </div>

    `;
}


startGame();

</script>
