<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Genesis 1–2 Surprise Jeopardy</title>
<style>
:root{--b:#060a78;--b2:#111a9a;--g:#ffcc33;--k:#080808}
*{box-sizing:border-box}body{margin:0;background:#000;color:#fff;font-family:Arial,sans-serif}
#game{max-width:1450px;margin:auto;padding:16px}.bar,.panel,.score,.wrap{background:var(--b);border:4px solid var(--k);border-radius:8px}
.bar{padding:14px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.title{font-size:25px;font-weight:900;text-transform:uppercase}.sub{font-size:14px;color:#ddd}
.wrap{overflow-x:auto;margin-top:12px}.board{min-width:1180px;display:grid;grid-template-columns:repeat(8,1fr);gap:5px;padding:7px}
.cat{min-height:88px;border:3px solid var(--k);display:flex;align-items:center;justify-content:center;text-align:center;padding:8px;font-weight:900;text-transform:uppercase;text-shadow:2px 2px #000}
.cell{min-height:80px;background:var(--b);border:3px solid var(--k);color:var(--g);font-size:28px;font-weight:900;text-shadow:2px 2px #000;cursor:pointer}.cell:hover{background:var(--b2)}.cell:disabled{background:#111;color:#666;cursor:not-allowed;text-shadow:none}
.scores{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}.score{padding:12px}.scoreval{color:var(--g);font-size:30px;font-weight:900;margin:8px 0}
.btn,.choice{min-height:44px;border:2px solid var(--g);border-radius:6px;background:#111;color:#fff;font-weight:800;padding:10px 14px;cursor:pointer}.btn:hover,.choice:hover{background:#222}
.panel{padding:22px}.hidden{display:none!important}.head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--g);padding-bottom:10px}
.value{color:var(--g);font-size:22px;font-weight:900}.ref{font-size:21px;font-weight:900}.question{font-size:30px;line-height:1.35;font-weight:800;text-align:center;padding:28px 10px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:1000px;margin:auto}.choice{text-align:left;background:#05055f;font-size:18px}.choice.selected{outline:4px solid #fff}.choice.correct{color:var(--g);outline:4px solid var(--g);background:#111}
.answer{background:#111;border:2px solid var(--g);border-radius:8px;padding:16px;color:var(--g);font-size:24px;font-weight:900;max-width:1000px;margin:18px auto 0}
.controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:18px}
.surprise{background:#111;border:4px solid var(--g);border-radius:10px;padding:24px;text-align:center;max-width:760px;margin:20px auto}.surprise h2{color:var(--g);font-size:36px;margin:0 0 10px}
.wrow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}.wrow select,.wrow input{font-size:18px;padding:10px;border:2px solid var(--g);border-radius:6px;min-height:44px}
.good{color:#74ff9c}.bad{color:#ff8b8b}@media(max-width:800px){.scores{grid-template-columns:1fr}.choices{grid-template-columns:1fr}.question{font-size:22px}}
</style></head><body><main id="game">
<section id="boardView"><div class="bar"><div><div class="title">Genesis 1–2 Surprise Jeopardy</div><div class="sub">Fresh Study Guide 2 questions · Used squares stay checked off</div></div><button id="reset" class="btn">Reset Game</button></div>
<div class="wrap"><div id="board" class="board"></div></div>
<div class="scores">
<div class="score"><b>Team 1</b><div id="s0" class="scoreval">0</div><button class="sb btn" data-t="0" data-d="100">+100</button> <button class="sb btn" data-t="0" data-d="-100">−100</button></div>
<div class="score"><b>Team 2</b><div id="s1" class="scoreval">0</div><button class="sb btn" data-t="1" data-d="100">+100</button> <button class="sb btn" data-t="1" data-d="-100">−100</button></div>
<div class="score"><b>Team 3</b><div id="s2" class="scoreval">0</div><button class="sb btn" data-t="2" data-d="100">+100</button> <button class="sb btn" data-t="2" data-d="-100">−100</button></div>
</div></section>
<section id="wagerView" class="panel hidden"><div class="surprise"><h2>Surprise Jeopardy!</h2><div>Choose the team and wager before the question is revealed.</div>
<div class="wrow"><select id="wt"><option value="0">Team 1</option><option value="1">Team 2</option><option value="2">Team 3</option></select><input id="wa" type="number" min="100" step="100" value="100"><button id="lock" class="btn">Lock Wager & Show Question</button></div><div id="wn" class="sub" style="margin-top:8px"></div></div></section>
<section id="qView" class="panel hidden"><div class="head"><div><b id="qc"></b><div id="qv" class="value"></div></div><div id="qr" class="ref"></div></div><div id="qq" class="question"></div><div id="choices" class="choices"></div>
<div id="ans" class="answer hidden"><div style="font-size:13px;color:#fff">CORRECT ANSWER</div><div id="at"></div></div>
<div class="controls"><button id="show" class="btn">Show Answer</button><button id="yes" class="btn hidden">Correct</button><button id="no" class="btn hidden">Incorrect</button><button id="back" class="btn">Back to Board</button></div><div id="res" style="text-align:center;font-size:20px;font-weight:900;margin-top:10px"></div></section>
</main><script>
const cats=[{"name": "Light & Days", "questions": [{"ref": "Genesis 1:7", "q": "According to Genesis 1:7, what did the firmament divide?", "a": "The waters under the firmament from the waters above the firmament.", "choices": ["The waters under the firmament from the waters above the firmament.", "The sea from the dry land.", "The day from the night.", "The light from the darkness."], "correctIndex": 0}, {"ref": "Genesis 1:9", "q": "According to Genesis 1:9, what appeared after the waters were gathered together?", "a": "The dry land.", "choices": ["The stars.", "The firmament.", "The grass.", "The dry land."], "correctIndex": 3}, {"ref": "Genesis 1:12", "q": "According to Genesis 1:12, how did the earth bring forth grass, herbs, and trees?", "a": "According to their kind.", "choices": ["Only after rain fell.", "According to their kind.", "According to the seasons.", "All at one time without seed."], "correctIndex": 1}, {"ref": "Genesis 1:5", "q": "According to Genesis 1:5, what made up the first day?", "a": "The evening and the morning.", "choices": ["The evening and the morning.", "The morning and the night.", "The day and the stars.", "The light and the firmament."], "correctIndex": 0}, {"ref": "Genesis 1:4", "q": "According to Genesis 1:4, what did God see concerning the light?", "a": "That it was good.", "choices": ["That it was greater than darkness.", "That it was good.", "That it needed the sun.", "That it was complete."], "correctIndex": 1}]}, {"name": "Signs & Lights", "questions": [{"ref": "Genesis 1:17", "q": "According to Genesis 1:17, where did God set the lights?", "a": "In the firmament of the heavens.", "choices": ["Upon the mountains.", "In the firmament of the heavens.", "In the seas.", "In the Garden of Eden."], "correctIndex": 1}, {"ref": "Genesis 1:13", "q": "According to Genesis 1:13, which day ended with the evening and the morning?", "a": "The third day.", "choices": ["The third day.", "The fourth day.", "The fifth day.", "The second day."], "correctIndex": 0}, {"ref": "Genesis 1:18", "q": "According to Genesis 1:18, what were the lights to divide?", "a": "The light from the darkness.", "choices": ["The heavens from the earth.", "The waters from the land.", "The morning from the evening.", "The light from the darkness."], "correctIndex": 3}, {"ref": "Genesis 1:15", "q": "According to Genesis 1:15, what were the lights in the firmament to give upon the earth?", "a": "Light.", "choices": ["Rain.", "Light.", "Warmth.", "Seasons."], "correctIndex": 1}, {"ref": "Genesis 1:18", "q": "According to Genesis 1:18, what were the lights to rule over?", "a": "The day and the night.", "choices": ["The birds and the fish.", "The seasons and the years.", "The land and the seas.", "The day and the night."], "correctIndex": 3}]}, {"name": "Sea & Sky", "questions": [{"ref": "Genesis 1:19", "q": "According to Genesis 1:19, which day ended after God made the lights?", "a": "The fourth day.", "choices": ["The third day.", "The sixth day.", "The fifth day.", "The fourth day."], "correctIndex": 3}, {"ref": "Genesis 1:21", "q": "According to Genesis 1:21, what did God create in the waters?", "a": "Great sea creatures and every living thing that moves.", "choices": ["Cattle and creeping things.", "Great sea creatures and every living thing that moves.", "Birds only.", "Only fish that were small."], "correctIndex": 1}, {"ref": "Genesis 1:22", "q": "According to Genesis 1:22, what did God tell the birds to do?", "a": "Multiply on the earth.", "choices": ["Fill the seas.", "Rule over the cattle.", "Remain in the firmament.", "Multiply on the earth."], "correctIndex": 3}, {"ref": "Genesis 1:21", "q": "According to Genesis 1:21, how were the sea creatures and birds created?", "a": "According to their kind.", "choices": ["According to the seasons.", "According to their size.", "According to where Adam named them.", "According to their kind."], "correctIndex": 3}, {"ref": "Genesis 1:22", "q": "According to Genesis 1:22, what did God tell the creatures of the sea to do?", "a": "Be fruitful and multiply, and fill the waters in the seas.", "choices": ["Have dominion over mankind.", "Be fruitful and multiply, and fill the waters in the seas.", "Remain only in one sea.", "Come onto the dry land."], "correctIndex": 1}]}, {"name": "People & Provision", "questions": [{"ref": "Genesis 1:28", "q": "According to Genesis 1:28, what did God tell mankind to do concerning the earth?", "a": "Fill the earth and subdue it.", "choices": ["Gather into one place.", "Leave the earth untouched.", "Build cities immediately.", "Fill the earth and subdue it."], "correctIndex": 3}, {"ref": "Genesis 1:26", "q": "According to Genesis 1:26, over what were people to have dominion?", "a": "The fish, birds, cattle, all the earth, and every creeping thing.", "choices": ["The sun, moon, and stars.", "The fish, birds, cattle, all the earth, and every creeping thing.", "Only the Garden of Eden.", "Only the cattle and birds."], "correctIndex": 1}, {"ref": "Genesis 1:30", "q": "According to Genesis 1:30, what did God give the animals for food?", "a": "Every green herb.", "choices": ["The herbs that yield seed only.", "Every fruit tree.", "The fish of the sea.", "Every green herb."], "correctIndex": 3}, {"ref": "Genesis 1:23", "q": "According to Genesis 1:23, which day ended after the sea creatures and birds were created?", "a": "The fifth day.", "choices": ["The fifth day.", "The third day.", "The sixth day.", "The fourth day."], "correctIndex": 0}, {"ref": "Genesis 1:29", "q": "According to Genesis 1:29, what did God give mankind for food?", "a": "Every herb that yields seed and every tree whose fruit yields seed.", "choices": ["Only the green herbs.", "Only fruit from one tree.", "Every animal on the earth.", "Every herb that yields seed and every tree whose fruit yields seed."], "correctIndex": 3}]}, {"name": "Eden Begins", "questions": [{"ref": "Genesis 2:11", "q": "According to Genesis 2:11, what was the name of the first river?", "a": "Pishon.", "choices": ["Gihon.", "Euphrates.", "Hiddekel.", "Pishon."], "correctIndex": 3}, {"ref": "Genesis 2:8", "q": "According to Genesis 2:8, whom did God put in the garden He had planted?", "a": "The man whom He had formed.", "choices": ["The man whom He had formed.", "The angels.", "All the animals.", "The woman first."], "correctIndex": 0}, {"ref": "Genesis 2:9", "q": "According to Genesis 2:9, how are the trees God made described?", "a": "Pleasant to the sight and good for food.", "choices": ["Only useful for shade.", "Hidden from the man.", "Tall and without fruit.", "Pleasant to the sight and good for food."], "correctIndex": 3}, {"ref": "Genesis 2:4", "q": "According to Genesis 2:4, what name is used for God in the account of the heavens and the earth?", "a": "The LORD God.", "choices": ["God Most High.", "The LORD God.", "The Almighty.", "The God of Abraham."], "correctIndex": 1}, {"ref": "Genesis 2:10", "q": "According to Genesis 2:10, into how many riverheads did the river from Eden part?", "a": "Four.", "choices": ["Seven.", "Two.", "Four.", "Three."], "correctIndex": 2}]}, {"name": "Rivers & Lands", "questions": [{"ref": "Genesis 2:11", "q": "According to Genesis 2:11, what land did the Pishon River skirt?", "a": "The whole land of Havilah.", "choices": ["The land of Eden.", "The whole land of Cush.", "The land of Assyria.", "The whole land of Havilah."], "correctIndex": 3}, {"ref": "Genesis 2:12", "q": "According to Genesis 2:12, how is the gold of that land described?", "a": "Good.", "choices": ["Good.", "Abundant.", "Pure.", "Rare."], "correctIndex": 0}, {"ref": "Genesis 2:13", "q": "According to Genesis 2:13, what was the name of the second river?", "a": "Gihon.", "choices": ["Gihon.", "Hiddekel.", "Euphrates.", "Pishon."], "correctIndex": 0}, {"ref": "Genesis 2:12", "q": "According to Genesis 2:12, what two things are named there besides gold?", "a": "Bdellium and the onyx stone.", "choices": ["Cedar and myrrh.", "Silver and bronze.", "Bdellium and the onyx stone.", "Pearls and rubies."], "correctIndex": 2}, {"ref": "Genesis 2:13", "q": "According to Genesis 2:13, what land did the Gihon River go around?", "a": "The whole land of Cush.", "choices": ["The land of Assyria.", "The whole land of Cush.", "The whole land of Havilah.", "The land of Canaan."], "correctIndex": 1}]}, {"name": "Names & Commands", "questions": [{"ref": "Genesis 2:19", "q": "According to Genesis 2:19, from what did the LORD God form every beast and every bird?", "a": "Out of the ground.", "choices": ["Out of the ground.", "Out of the trees.", "Out of the waters.", "Out of Adam's rib."], "correctIndex": 0}, {"ref": "Genesis 2:14", "q": "According to Genesis 2:14, what was the name of the fourth river?", "a": "Euphrates.", "choices": ["Pishon.", "Euphrates.", "Hiddekel.", "Gihon."], "correctIndex": 1}, {"ref": "Genesis 2:14", "q": "According to Genesis 2:14, what was the name of the third river?", "a": "Hiddekel.", "choices": ["Pishon.", "Gihon.", "Hiddekel.", "Euphrates."], "correctIndex": 2}, {"ref": "Genesis 2:18", "q": "According to Genesis 2:18, what kind of helper did God say He would make for man?", "a": "A helper comparable to him.", "choices": ["A helper comparable to him.", "A servant for him.", "A helper stronger than him.", "A helper from among the animals."], "correctIndex": 0}, {"ref": "Genesis 2:16", "q": "According to Genesis 2:16, what did God say man could freely eat from?", "a": "Every tree of the garden.", "choices": ["Every herb outside the garden.", "Only the trees near the river.", "Every tree of the garden.", "Only the tree of life."], "correctIndex": 2}]}, {"name": "Adam & Woman", "questions": [{"ref": "Genesis 2:19", "q": "According to Genesis 2:19, why did God bring the animals to Adam?", "a": "To see what he would call them.", "choices": ["To see which ones he would eat.", "To place them outside Eden.", "To see what he would call them.", "To choose one as his helper."], "correctIndex": 2}, {"ref": "Genesis 2:23", "q": "According to Genesis 2:23, why was she called Woman?", "a": "Because she was taken out of Man.", "choices": ["Because she named the animals.", "Because she was created first.", "Because she was taken out of Man.", "Because she tended the garden."], "correctIndex": 2}, {"ref": "Genesis 2:21", "q": "According to Genesis 2:21, what did the LORD God cause to fall on Adam?", "a": "A deep sleep.", "choices": ["Darkness.", "A great fear.", "A mist.", "A deep sleep."], "correctIndex": 3}, {"ref": "Genesis 2:20", "q": "According to Genesis 2:20, for whom was there not found a helper comparable to him?", "a": "Adam.", "choices": ["The serpent.", "The cattle.", "Eve.", "Adam."], "correctIndex": 3}, {"ref": "Genesis 2:25", "q": "According to Genesis 2:25, how are the man and his wife described?", "a": "They were both naked and were not ashamed.", "choices": ["They were ashamed of one another.", "They were hidden among the trees.", "They were both naked and were not ashamed.", "They were clothed and afraid."], "correctIndex": 2}]}],vals=[100,200,300,400,500],used=new Set(),scores=[0,0,0];let cur=null,wager=null,surprises=new Set();
const $=id=>document.getElementById(id),board=$('board'),bv=$('boardView'),wv=$('wagerView'),qv=$('qView');
function pickSurprises(){surprises.clear();let a=[];for(let c=0;c<8;c++)for(let r=0;r<5;r++)a.push(c+'-'+r);for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}a.slice(0,3).forEach(x=>surprises.add(x))}
function draw(){board.innerHTML='';cats.forEach(c=>{let d=document.createElement('div');d.className='cat';d.textContent=c.name;board.appendChild(d)});for(let r=0;r<5;r++)cats.forEach((c,ci)=>{let id=ci+'-'+r,b=document.createElement('button');b.className='cell';b.textContent=used.has(id)?'✓':vals[r];b.disabled=used.has(id);b.onclick=()=>select(ci,r);board.appendChild(b)})}
function select(ci,ri){let id=ci+'-'+ri;cur={ci,ri,id,base:vals[ri],surprise:surprises.has(id),q:cats[ci].questions[ri]};wager=null;$('res').textContent='';if(cur.surprise){bv.classList.add('hidden');wv.classList.remove('hidden');$('wa').value=100;note()}else showQ()}
function note(){let t=+$('wt').value,max=scores[t]>0?scores[t]:500;$('wn').textContent='Current score: '+scores[t]+' · Maximum wager: '+max;$('wa').max=max}
$('wt').onchange=note;$('lock').onclick=()=>{let t=+$('wt').value,max=scores[t]>0?scores[t]:500,a=Math.round(+$('wa').value/100)*100;if(!a||a<100)a=100;if(a>max)a=max;wager={team:t,amount:a};wv.classList.add('hidden');showQ()}
function showQ(){let q=cur.q;bv.classList.add('hidden');wv.classList.add('hidden');qv.classList.remove('hidden');$('qc').textContent=(cur.surprise?'SURPRISE JEOPARDY — ':'')+cats[cur.ci].name;$('qv').textContent=cur.surprise?wager.amount+' point wager':cur.base+' points';$('qr').textContent=q.ref;$('qq').textContent=q.q;$('at').textContent=q.a;$('ans').classList.add('hidden');$('show').disabled=false;$('yes').classList.add('hidden');$('no').classList.add('hidden');let ch=$('choices');ch.innerHTML='';q.choices.forEach((x,i)=>{let b=document.createElement('button');b.className='choice';b.textContent=String.fromCharCode(65+i)+'. '+x;b.onclick=()=>{ch.querySelectorAll('.choice').forEach(y=>y.classList.remove('selected'));b.classList.add('selected')};ch.appendChild(b)})}
$('show').onclick=()=>{$('ans').classList.remove('hidden');$('show').disabled=true;$('choices').querySelectorAll('.choice').forEach((b,i)=>{b.disabled=true;if(i===cur.q.correctIndex)b.classList.add('correct')});if(cur.surprise){$('yes').classList.remove('hidden');$('no').classList.remove('hidden')}}
function scoreWager(ok){if(!cur.surprise||!wager)return;scores[wager.team]+=ok?wager.amount:-wager.amount;$('s'+wager.team).textContent=scores[wager.team];$('res').className=ok?'good':'bad';$('res').textContent=(ok?'Correct! +':'Incorrect. -')+wager.amount+' points for Team '+(wager.team+1);$('yes').disabled=$('no').disabled=true}
$('yes').onclick=()=>scoreWager(true);$('no').onclick=()=>scoreWager(false);$('back').onclick=()=>{used.add(cur.id);qv.classList.add('hidden');bv.classList.remove('hidden');$('yes').disabled=$('no').disabled=false;draw()}
document.querySelectorAll('.sb').forEach(b=>b.onclick=()=>{let t=+b.dataset.t;scores[t]+=+b.dataset.d;$('s'+t).textContent=scores[t]})
$('reset').onclick=()=>{if(confirm('Reset all used questions, scores, and Surprise Jeopardy locations?')){used.clear();scores.fill(0);for(let i=0;i<3;i++)$('s'+i).textContent=0;pickSurprises();draw()}}
pickSurprises();draw();
</script></body></html>
